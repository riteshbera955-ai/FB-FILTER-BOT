services:
  - type: worker
    name: permanent-link-filter-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    disk:
      name: link-filter-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DB_PATH
        value: /var/data/links.db
